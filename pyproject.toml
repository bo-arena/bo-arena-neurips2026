[project]

name = "bo-arena"
dynamic = ["version"]
description = "Arena for simple, reliable, and efficient benchmarking of BO algorithms."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jaxtyping>=0.3.11",
    "wandb>=0.31",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "bencherscaffold@git+https://github.com/LeoIV/BencherScaffold@c119035a059cf34c82c3183fa53634070df3a3d6",
    "torch>=2.14.1",
    "botorch[fully_bayesian]>=0.18.1",
    "jax[cuda13]>=0.9.2; sys_platform == 'linux'",
    "gpytorch>=1.15.2",
]

[dependency-groups]
test = ["beartype>=0.23.1", "pytest>=9.1.1"]
dev = ["ruff==0.17.0", "pre-commit>=4.7", "jupytext>=1.19.6", "ipykernel>=7.4"]
experiments = ["py-cpuinfo>=9"]
plotting = ["matplotlib>=3.11.2", "tueplots>=0.2.5"]

# PEP 518 Build System Configuration
# See https://peps.python.org/pep-0518/

[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bo_arena"]

[tool.setuptools.dynamic]
version = { attr = "bo_arena.__version__" }

# Testing Configuration
# See https://docs.pytest.org/en/stable/reference/customize.html

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
    "--jaxtyping-packages=bo_arena,beartype.beartype",
]

# Linting Configuration
# See https://docs.astral.sh/ruff/rules/#legend

[tool.ruff]
preview = true
exclude = [".git", "__pycache__", ".venv", "notebooks"]
target-version = "py314"

[tool.ruff.lint]
select = [
    "ARG", # flake8-unused-arguments
    "ASYNC", # flake8-async
    "ANN", # flake8-annotations
    "B", # flake8-bugbear
    "BLE", # flake8-blind-except
    "C4", # flake8-comprehensions
    "C90", # mccabe
    "COM", # flake8-commas
    "D", # pydocstyle
    "DTZ", # flake8-datetimez
    "E", # pycodestyle error
    "EM", # flake8-errmsg
    "ERA", # eradicate
    "F", # Pyflakes
    "FBT", # flake8-boolean-trap
    "FLY", # flynt
    "FURB", # refurb
    "G", # flake8-logging-format
    "I", # isort
    "ICN", # flake8-import-conventions
    "INT", # flake8-gettext
    "ISC", # flake8-implicit-str-concat
    "LOG", # flake8-logging
    "N", # pep8-naming
    "NPY", # NumPy
    "PERF", # Perflint
    "PGH", # pygrep-hooks
    "PIE", # flake8-pie
    "PL", # Pylint
    "PT", # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "PYI", # flake8-pyi
    "Q", # flake8-quotes
    "RET", # flake8-return
    "RSE", # flake8-raise
    "RUF", # Ruff
    "S", # flake8-bandit
    "SLOT", # flake8-slots
    "T10", # flake8-debugger
    "TCH", # flake8-type-checking
    "TD", # flake8-todos
    "TID", # flake8-tidy-imports
    "TRY", # tryceratops
    "SIM", # flake8-simplify
    "SLF", # flake8-self
    "UP", # pyupgrade
    "W", # pycodestyle warning
    "YTT", # flake8-2020
]
ignore = [
    # Conflicting lint rules with Ruff's formatter
    "tab-indentation",
    "indentation-with-invalid-multiple",
    "indentation-with-invalid-multiple-comment",
    "over-indented",
    "docstring-tab-indentation",
    "triple-single-quotes",
    "bad-quotes-inline-string",
    "bad-quotes-multiline-string",
    "bad-quotes-docstring",
    "avoidable-escaped-quote",
    "missing-trailing-comma",
    "prohibited-trailing-comma",
    "single-line-implicit-string-concatenation",
    "multi-line-implicit-string-concatenation",
    "boolean-type-hint-positional-argument",
    "boolean-positional-value-in-call",
    "missing-todo-link",
    "raise-vanilla-args",
    # It is fine to override loop variables when it is clear that only the value that
    # overrides the original is needed
    "redefined-loop-name",
    # It is often impossible to enforce a hard limit on the number of arguments
    "too-many-arguments",
    "too-many-positional-arguments",
    # The performance of logging is not a concern for us; in return, using f-strings
    # makes the logged messages much more readable in code
    "logging-f-string",
    # We do not annotate __init__ methods -- args are specified in the class docstring
    "undocumented-public-init",
    # This is research code, attribute names are more flexible with casing
    "ambiguous-variable-name",
    "invalid-function-name",
    "invalid-argument-name",
    "non-lowercase-variable-in-function",
    "lowercase-imported-as-non-lowercase",
    "mixed-case-variable-in-class-scope",
    "mixed-case-variable-in-global-scope",
    # Magic values are fine for academic code as longs as they are not overused
    "magic-value-comparison",
    "too-many-branches",
    "too-many-locals",
    # In-place assigments are not always possible in torch
    "non-augmented-assignment",
    # Assignments before return can emphasize the code's semantic structure
    "unnecessary-assign",
    "suspicious-pickle-import",
    # We don't do cryptography
    "suspicious-non-cryptographic-random-usage",
    # The subprocess module is fine as long as one validates the commands
    "suspicious-subprocess-import",
    # Jaxtyping is incompatible with the checking of annotation strings
    "forward-annotation-syntax-error",
    # Jaxtyping/beartype evaluate annotations at runtime, so imports used only in
    # annotations must not be moved into TYPE_CHECKING blocks
    "typing-only-first-party-import",
    "typing-only-third-party-import",
    "typing-only-standard-library-import",
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["assert"] # Use of assert is allowed in test files

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-third-party = ["wandb"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
